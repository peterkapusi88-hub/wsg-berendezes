<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#276b6a"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0,10L10,0" stroke="#bd7e50" stroke-width="1"/></pattern></defs><style>text{font-family:Arial,sans-serif;fill:#193c40} .title{font-size:30px;font-weight:700}.sub{font-size:18px}.body{font-size:17px}.small{font-size:15px}.bold{font-weight:700}.border{stroke:#476865;stroke-width:2}.arrow{stroke:#276b6a;stroke-width:3;marker-end:url(#arrow)}.tentative{stroke:#b77642;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><rect width="1440" height="1180" fill="#f5f3ed"/><text x="50" y="55" class="title">A-902 • P0 tájolási, kilátási és belátási audit</text><text x="50" y="90" class="sub">Meglévő térkapcsolatok • nem berendezési terv • P0-v1 / 2026.10.27.</text><rect x="40" y="115" width="810" height="820" rx="12" fill="white"/><rect x="875" y="115" width="525" height="820" rx="12" fill="white"/><text x="70" y="150" class="sub bold">Rajzi koordinátákban ábrázolt meglévő felületek</text><text x="70" y="176" class="small">A méretek modellből származnak; a szinteltérések külön jelölve.</text><rect x="284.3" y="301.0" width="369.9" height="191.7" fill="#b7cfb2" class="tentative" style="fill:#b7cfb2"/><rect x="276.2" y="523.0" width="175.5" height="117.0" fill="#d9ddd9" class="border" style="fill:#d9ddd9"/><rect x="514.7" y="523.0" width="146.4" height="117.0" fill="#d9ddd9" class="border" style="fill:#d9ddd9"/><rect x="451.7" y="523.0" width="63.0" height="117.0" fill="#9c8371" class="border" style="fill:#9c8371"/><rect x="276.2" y="492.7" width="384.9" height="30.3" fill="#9c8371" class="border" style="fill:#9c8371"/><rect x="451.7" y="461.2" width="63.0" height="31.5" fill="#9c8371" class="border" style="fill:#9c8371"/><rect x="401.6" y="301.3" width="114.0" height="25.2" fill="#9c8371" class="border" style="fill:#9c8371"/><polygon points="164.0,901.0 112.7,901.0 112.7,724.3 139.4,724.3 139.4,658.0 164.0,658.0" fill="#d9ddd9" class="border"/><rect x="164.0" y="646.0" width="497.1" height="255.0" fill="#e9ece7" class="border" style="fill:#e9ece7"/><polygon points="164.0,901.0 112.7,901.0 112.7,724.3 139.4,724.3 139.4,658.0 164.0,658.0" fill="#d9ddd9" class="border"/><rect x="367.4" y="541.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="367.4" y="532.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="367.4" y="523.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="514.7" y="541.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="514.7" y="532.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="514.7" y="523.0" width="36.0" height="9.0" fill="#b29a85" class="border" style="fill:#b29a85"/><rect x="296.0" y="542.8" width="60.0" height="60.0" fill="url(#hatch)" class="tentative" style="fill:url(#hatch)"/><text x="320" y="400" class="sub bold">ZÖLDTETŐ • 71,18 m²</text><text x="310" y="427" class="body">Gyep + középső dombos ágyás</text><text x="300" y="450" class="small">Szint és növényhatár nem kimért</text><text x="310" y="620" class="body bold">T09 • 23,62 m²</text><text x="535" y="620" class="body bold">T10 • 19,34 m²</text><text x="305" y="678" class="small">Fix jakuzzi-zóna</text><text x="305" y="700" class="small">marker ≠ készülékméret</text><text x="330" y="747" class="sub bold">NAPPALI → T09</text><text x="535" y="747" class="body bold">05.3 → T10</text><text x="330" y="780" class="body">Belső fellépő: tervi 15 cm</text><text x="250" y="844" class="sub bold">LAKÁS • sematikus befoglaló</text><text x="75" y="920" class="small">Oldalerkély: 11,26 m² • L-kontúr • 05.1 / 05.2</text><path d="M483.2,492.7 L625,475" class="tentative"/><text x="635" y="478" class="small bold">PLUSZ FELLÉPÉS</text><text x="635" y="500" class="small">fotón igazolt, cm: ?</text><text x="300" y="229" class="sub bold">ELŐRE ≈ ÉK / +y ≈ 53°</text><text x="280" y="255" class="small">Új ház / felső teraszok: belátási szektor</text><path d="M325,273 H775" class="tentative"/><path d="M540,280 V315" class="arrow"/><text x="67" y="325" class="small bold">BALRA ≈ ÉNy</text><text x="67" y="349" class="small">város / hegyek</text><text x="67" y="373" class="small">panoráma</text><path d="M300,390 H228" class="arrow"/><text x="720" y="720" class="small bold">JOBBRA</text><text x="720" y="741" class="small bold">≈ DK</text><text x="910" y="155" class="sub bold">Földrajzi iránytű a rajzhoz</text><circle cx="1135" cy="320" r="102" fill="#f3f6f3" stroke="#c5d0ca"/><line x1="1135" y1="320" x2="1062.3" y2="265.2" class="arrow"/><text x="1032.8" y="249.0" text-anchor="middle" class="body bold">É</text><line x1="1135" y1="320" x2="1122.3" y2="229.9" class="arrow"/><text x="1117.2" y="199.2" text-anchor="middle" class="body bold">ÉK</text><line x1="1135" y1="320" x2="1189.8" y2="247.3" class="arrow"/><text x="1212.0" y="223.8" text-anchor="middle" class="body bold">K</text><line x1="1135" y1="320" x2="1225.1" y2="307.3" class="arrow"/><text x="1261.8" y="308.2" text-anchor="middle" class="body bold">DK</text><line x1="1135" y1="320" x2="1207.7" y2="374.8" class="arrow"/><text x="1237.2" y="403.0" text-anchor="middle" class="body bold">D</text><line x1="1135" y1="320" x2="1147.7" y2="410.1" class="arrow"/><text x="1152.8" y="452.8" text-anchor="middle" class="body bold">DNy</text><line x1="1135" y1="320" x2="1080.2" y2="392.7" class="arrow"/><text x="1058.0" y="428.2" text-anchor="middle" class="body bold">Ny</text><line x1="1135" y1="320" x2="1044.9" y2="332.7" class="arrow"/><text x="1008.2" y="343.8" text-anchor="middle" class="body bold">ÉNy</text><text x="910" y="493" class="body">+y : előre ≈ 53° / ÉK</text><text x="910" y="521" class="body">+x : jobbra ≈ 143° / DK</text><text x="910" y="549" class="body">Észak: a papíron ferdén balra-felfelé.</text><text x="910" y="596" class="body bold">KILÁTÁS ÉS BELÁTÁS EGYSZERRE</text><text x="910" y="625" class="small">Ny / ÉNy: megőrzendő városi–hegyi panoráma.</text><text x="910" y="653" class="small">É / ÉK: megmaradó kilátási rések lehetségesek.</text><text x="910" y="681" class="small">K / DK: saját és új épületek belátása.</text><text x="910" y="709" class="small">DK: lehetséges távoli nézet; Puskás nem igazolt.</text><text x="910" y="737" class="small">Előre: várható új, 9 emeletes teraszos ház.</text><text x="910" y="765" class="small">Azonos teraszmagasság: tulajdonosi várakozás.</text><text x="910" y="813" class="small">Napóraszám és árnyékhatár: NINCS kimérve.</text><text x="910" y="841" class="small">Jelentős új árnyékot a tulajdonos nem vár.</text><text x="910" y="869" class="small">A szektorok nem méretezett láthatósági határok.</text><rect x="40" y="960" width="1360" height="175" rx="12" fill="#e5ebe5"/><text x="65" y="995" class="small">Forrás: PLAN3 + PLAN18 + U07 észak-felfelé Google Maps-kép + tulajdonosi közlések + P01–P33 / T01–T08.</text><text x="65" y="1024" class="small">A 3. lap helyszínvázlati északjelét nem másoljuk a nagy alaprajzra. A műholdkép az 1:50-es terv elfordulását támogatja.</text><text x="65" y="1053" class="small">Szaggatott vonal: becsült kontúr / nem kimért hely. A pontos épületmagasság, távolság és kilátási sugár ismeretlen.</text><text x="65" y="1082" class="small">WPC: a modell minden részt egy szintre tesz, a fotók további fellépést mutatnak. Ez az ábra nem korrigált kivitelezési geometria.</text><text x="65" y="1111" class="small">P0 jóváhagyásra • nincs P1-koncepció • meglévő Blender-fájlok változatlanok • azonos ténycsomag két későbbi AI-nak.</text></svg>