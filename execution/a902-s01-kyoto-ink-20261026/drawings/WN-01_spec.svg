			<text x="55" y="688" style="font-family: Arial; font-size: 11px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,1376) scale(1,-1)">3020 mm tervfülke: 50+2920+50 mm névleges. Egyedi korpusz; PAX 2994 mm helyett szerelhetőbb ajánlati változat. 1 hosszú akasztós, 1 dupla akasztós, 2</text>
