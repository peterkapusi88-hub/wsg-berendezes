			<text x="55" y="479" style="font-family: Arial; font-size: 13px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,958) scale(1,-1)">Működés és szerelés</text>
			<text x="55" y="457" style="font-family: Arial; font-size: 11px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,914) scale(1,-1)">csillapított 110° pánt; teljes kihúzású fiók; pontos típusszám és teherbírás gyártói kiosztás szerint. matt fekete fogásprofil / hosszú fogantyú a nézet</text>
			<text x="55" y="441" style="font-family: Arial; font-size: 11px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,882) scale(1,-1)">szerint. 80 mm visszahúzott lábazat; falibútornál nincs. 3 mm frontrés; 20 mm szerelési oldaltakaró tervezési minimum; kész falsíkhoz felmérendő</text>
			<text x="55" y="402" style="font-family: Arial; font-size: 13px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,804) scale(1,-1)">Szerviz és szakági kapcsolat</text>
