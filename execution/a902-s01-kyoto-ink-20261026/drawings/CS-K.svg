			<text x="60" y="182" style="font-family: Arial; font-size: 12px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,364) scale(1,-1)">pontos gyári csúszópántos kiosztás és légszabad keresztmetszet nélkül nem szabható.</text>
			<text x="60" y="110" style="font-family: Arial; font-size: 11px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,220) scale(1,-1)">A pult névleges38mm. F274 ST9 dekorra mutató látványjavaslat nem anyagminta. Minden vágott él, mosogatófurat és falcsatlakozás</text>
