			<text x="60" y="380" style="font-family: Arial; font-size: 12px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,760) scale(1,-1)">K-01: sütő niche564×590×550, alj600mm. Mikro niche564×365×min300, alj1280mm. A külső595/382magasságú készülék előlapja takar; a nyílás</text>
