			<text x="60" y="290" style="font-family: Arial; font-size: 12px;fill: rgb(14%,23%,23%); stroke:none;" transform="translate(0,580) scale(1,-1)">K-04: 600mm szabad gépnyílás! 600mm külső korpuszba18mm oldallapokkal nem fér az598mm gép. Nincs külön korpusz; pultáthidalás és</text>
