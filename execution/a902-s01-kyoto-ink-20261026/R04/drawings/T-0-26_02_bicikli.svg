				<text x="18" y="111" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,222) scale(1,-1)">Tervezési példa: 1 felnőtt bicikli 2000×700×1200 mm tárgybefoglalóval; falon állítva 1150×700 mm helyfoglalási próbával. Nem a tulajdonos lemért biciklije.</text>
				<text x="18" y="102.9" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,205) scale(1,-1)">A bicikli a déli fal jobb sarkán, 700×1150 mm alaprajzi borítékban áll; az eredeti próbához képest 90°-kal fordítva. Az ajtó és teljes kiemelési/fordulási út még nem igazolt.</text>
				<text x="18" y="94.80000000000001" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,189) scale(1,-1)">Mindkét BROR megmarad: T-R2 50 mm-rel balra kerül, a polcok összeérnek. A külön T-LUG padlóhely megszűnik: a bőröndök az alsó magas polcrekeszekbe kerülnek, dobozhelyet foglalva.</text>
				<text x="18" y="86.70000000000002" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,173) scale(1,-1)">A 8 gyári polc 8×840×540 mm névleges felülete 3,629 m². A bicikli és a T-R2 tervezési borítéka érinti egymást, nincs tartalékhézag. Szerelvény, belméret vagy mozgástér miatt módosítás kellhet; ez nem PASS.</text>
				<text x="18" y="78.60000000000002" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,157) scale(1,-1)">Kerékpártartó SKU, kerék/gumi-kompatibilitás, tömeg, falanyag és rögzítés még nyitott. A tartó + szerelés külön árazandó; nettó megtakarítás jelenleg nem állítható.</text>
