				<text x="274" y="11" style="font-family: KI; font-size: 2.15px;fill: rgb(69%,26%,19%); stroke:none;" transform="translate(0,22) scale(1,-1)">AJÁNLATI / EGYEZTETÉSI TERV - NEM GYÁRTÁSI KIADÁS</text>
				<text x="12" y="17" style="font-family: KI; font-size: 2.3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,34) scale(1,-1)">[D] korábbi tervadat  [J] új tervezési javaslat  [H] helyszíni / gyártói ellenőrzés</text>
				<text x="12" y="12" style="font-family: KI; font-size: 2.3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,24) scale(1,-1)">Szín a képernyőn tájékoztató. Anyag és nyomat fizikai mintával fogadható el.</text>
				<rect x="25" y="207" width="135" height="22" style="stroke: rgb(14%,14%,13%); stroke-linecap: butt; stroke-width: 0.18; fill: rgb(77%,73%,68%); fill-rule: evenodd;"/>
				<text x="25" y="200" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,400) scale(1,-1)">matt világos front</text>
				<rect x="25" y="157" width="135" height="22" style="stroke: rgb(14%,14%,13%); stroke-linecap: butt; stroke-width: 0.18; fill: rgb(27%,25%,24%); fill-rule: evenodd;"/>
				<text x="25" y="150" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,300) scale(1,-1)">grafit lábazat / keret</text>
				<rect x="25" y="107" width="135" height="22" style="stroke: rgb(14%,14%,13%); stroke-linecap: butt; stroke-width: 0.18; fill: rgb(92%,91%,88%); fill-rule: evenodd;"/>
				<text x="25" y="100" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,200) scale(1,-1)">világos belső</text>
				<text x="220" y="250" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,500) scale(1,-1)">Közös forma</text>
				<text x="220" y="244" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,488) scale(1,-1)">Sík, matt, visszafogott világos front; grafit belső keret vagy lábazat; azonos 3 mm tervezett fugacsalád. Új, hangsúlyos tusmotívumot nem adunk hozzá</text>
				<text x="220" y="240.1" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,480) scale(1,-1)">automatikusan.</text>
				<text x="220" y="229.2" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,458) scale(1,-1)">05.2 gardrób / gyerekszoba</text>
				<text x="220" y="223.2" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,446) scale(1,-1)">A magas ruhakapacitás megtartandó. Állítható polcok és átcsavarozható gyerekrúd; négy fiók. Játék alacsonyan, a magas rész szezonális ruháé; később</text>
				<text x="220" y="219.29999999999998" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,438) scale(1,-1)">a belső elemek cserélhetők, a korpusz marad.</text>
				<text x="220" y="208.39999999999998" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,416) scale(1,-1)">05.3 vendég / munka</text>
				<text x="220" y="202.39999999999998" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,404) scale(1,-1)">Sekély akasztós rész előre kihúzható rúddal. A4 iratokhoz megfelelő polcmagasság; négy fiók irodaszernek és vendégtextilnek. Az ágy, szék és ajtó</text>
				<text x="220" y="198.49999999999997" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,396) scale(1,-1)">együtt használhatósága még nyitott geometriai kérdés.</text>
				<text x="220" y="187.59999999999997" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,375) scale(1,-1)">Előtér</text>
				<text x="220" y="181.59999999999997" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,363) scale(1,-1)">Napi kabát és cipő, póráz, kulcs és tiszta törlő elérhető magasságban. A pad stabil szerkezetet és levehető kárpitot kap; a nedves cipő nem a ruhás</text>
				<text x="220" y="177.69999999999996" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,355) scale(1,-1)">rekeszbe kerül.</text>
				<text x="220" y="166.79999999999995" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,333) scale(1,-1)">Azonos részletek</text>
				<text x="220" y="160.79999999999995" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,321) scale(1,-1)">Korpusz 18 mm; a gyári lap látható éle 2 mm ABS javaslattal. Festett MDF élein csiszolt, festett zárás; nem kötelező rá ABS. Pánt, fiók és fogás</text>
				<text x="220" y="156.89999999999995" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,313) scale(1,-1)">szobánként, funkció szerint választható.</text>
				<text x="220" y="145.99999999999994" style="font-family: KIB; font-size: 3.0px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,291) scale(1,-1)">Rögzítendő döntés</text>
				<text x="220" y="139.99999999999994" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,279) scale(1,-1)">A színkód, pontos lapgyártó, kárpit és vasalat még mintára/ajánlatra vár. Ezek javasolt új formák; nem állítjuk róluk, hogy korábban elfogadott render</text>
				<text x="220" y="136.09999999999994" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,272) scale(1,-1)">mutatta őket.</text>
