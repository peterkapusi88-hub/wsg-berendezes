				<text x="18" y="111" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,222) scale(1,-1)">2× JONAXEL 504.199.72, 800×380×1600 mm; négy gyári polcszint. A rajzi polcszintek közelítő elhelyezések, a gyári szerelési rajz dönt.</text>
				<text x="18" y="103.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,206) scale(1,-1)">Középen a második fagyasztó tervezett helye: 597×675×1455 mm. FNd 4625 / GN46Vd25 névütközés: pontos EAN és kézikönyv még szükséges.</text>
				<text x="18" y="95.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,190) scale(1,-1)">600 mm nyitási próbaborítékkal a szemközti szabad sáv 545 mm. Ez nem teljes használati PASS; a valódi ajtó/fiók és a kezelő helyét együtt kell ellenőrizni.</text>
				<text x="18" y="87.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,174) scale(1,-1)">Vegyszer nem kerül az élelmiszer fölé. A napi tisztítószer a lakásban marad. A tároló klímáját és a fagyasztó szellőzését helyszínen kell ellenőrizni.</text>
				<text x="18" y="79.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,158) scale(1,-1)">Polconként 25 kg a gyártói érték; a falrögzítés külön helyszíni feladat. 2×23 000 Ft webshopár, szállítás és rögzítés nélkül. Ellenőrzés: 2026-10-27.</text>
