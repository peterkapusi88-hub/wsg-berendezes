				<text x="18" y="111" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,222) scale(1,-1)">A korábbi változat két BROR elemet és külön bőröndhelyet tartalmaz. Bicikli ebben még nem volt elhelyezve.</text>
				<text x="18" y="103.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,206) scale(1,-1)">2× BROR 596.194.05, 850×550×1900 mm, elemenként 4 polc. Állítható polcszintek; a legalsó szabad rekesz nagy bőröndnek készül.</text>
				<text x="18" y="95.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,190) scale(1,-1)">A tényleges ajtóhely ismeretlen, ezért a berendezés feltételes. A déli nyílás csak rajzi hozzáférési feltételezés.</text>
				<text x="18" y="87.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,174) scale(1,-1)">A biciklis változat a 02 lapon látható: mindkét polc megmarad, a külön padlón álló bőröndhely átkerül az alsó polcokra. A fordulás és ajtóhely ellenőrzendő.</text>
				<text x="18" y="79.0" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,158) scale(1,-1)">Gyártói ár 47 500 Ft / elem, 4 polccal; a gyártó 130 kg/polc értéket ad. A falrögzítés, összeépítés és tényleges padlóterhelés külön ellenőrzendő.</text>
