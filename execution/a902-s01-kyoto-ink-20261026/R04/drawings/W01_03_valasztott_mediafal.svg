				<text x="30" y="61" style="font-family: KI; font-size: 2.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,122) scale(1,-1)">Felső front: egybefüggő megjelenés [J]. Alsó front: 700 + 4×650 [J].</text>
				<text x="30" y="55" style="font-family: KI; font-size: 2.7px;fill: rgb(69%,26%,19%); stroke:none;" transform="translate(0,110) scale(1,-1)">Ez a változat eltér a régi TV-01 kétajtós / TV-02 600–750-es osztásától.</text>
				<text x="230" y="249" style="font-family: KIB; font-size: 3.4px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,498) scale(1,-1)">MEGVALÓSÍTÁSI ELV</text>
				<text x="230" y="241" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,482) scale(1,-1)">A 700 mm-es torony összefüggő felső frontja a választott látványt követi. A nyitási mód, ajtótömeg, merevítés és pántkészlet külön gyártói</text>
				<text x="230" y="236.9" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,473) scale(1,-1)">méretezésre vár.</text>
				<text x="230" y="227.8" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,455) scale(1,-1)">A grafit alsó bútor 150 mm-rel a padló felett lebeg. A torony és a TV saját falrögzítést kap; nem a dekorpanel hordja a televíziót.</text>
				<text x="230" y="218.70000000000002" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,437) scale(1,-1)">A front mögött működő tároló marad. A képen nem látható nyitás és kábelút nem tekinthető a kép által igazoltnak.</text>
				<text x="230" y="209.60000000000002" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,419) scale(1,-1)">Felületjavaslat: merev, sík hordozó; matt ásványi hatású, finom textúrájú bevonat; grafika kontrollált nyomattal vagy sablonos felvitellel.</text>
				<text x="230" y="205.50000000000003" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,411) scale(1,-1)">Reliefet a kép alapján nem írunk elő.</text>
				<text x="230" y="196.40000000000003" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,392) scale(1,-1)">A fekete rajz itt kompozíciós tanulmány. A képpel egyező végleges tusgrafika külön grafikai munka és 1:1 részletminta; nincs jóváhagyott</text>
				<text x="230" y="192.30000000000004" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,384) scale(1,-1)">nyomdai master.</text>
				<text x="230" y="183.20000000000005" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,366) scale(1,-1)">Kötelező minta: front és panel találkozása, grafika folytonossága, 3 mm fuga, súrolófény. A szín jóváhagyása nappali és esti fényben.</text>
				<text x="230" y="174.10000000000005" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,348) scale(1,-1)">A korábbi médiafal-előirányzatot az új fronttal és bevonattal újra kell árazni. Jelen lap nem állít költségazonosságot vagy gyártási</text>
				<text x="230" y="170.00000000000006" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,340) scale(1,-1)">jóváhagyást.</text>
