				<text x="15" y="258" style="font-family: KI; font-size: 3.2px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,516) scale(1,-1)">A 8. emeleti, dokumentáltan 4,57 m²-es tároló. A kész méretek és a két tervi dugalj helye ellenőrizendő.</text>
