				<text x="15" y="118" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,236) scale(1,-1)">Minek van itt helye?</text>
				<text x="15" y="111" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,222) scale(1,-1)">Két fehér JONAXEL polc: összesen 8 polcszint. Balra ital és élelmiszertartalék; jobbra ritkábban használt konyhai gépek, tálak és</text>
				<text x="15" y="106.6" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,213) scale(1,-1)">dobozok. A nehéz dolgok alul, a könnyű tartalék felül. Vegyszer nem kerül az élelmiszer fölé.</text>
				<text x="15" y="95.19999999999999" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,190) scale(1,-1)">Mennyit lehet elhelyezni?</text>
				<text x="15" y="88.19999999999999" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,176) scale(1,-1)">A 8×800×380 mm névleges polcfelület felső becslése 2,43 m²; a keretek levonandók. Egy szinten legfeljebb két 350×300 mm-es</text>
				<text x="15" y="83.79999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,167) scale(1,-1)">próbadoboz: 16 helyből 4 maradjon szabadon, tehát 12 ilyen doboz tervezhető. A gépek ugyanebből a helyből foglalnak, nem ezen</text>
				<text x="15" y="79.39999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,158) scale(1,-1)">felül.</text>
				<text x="15" y="67.99999999999997" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,135) scale(1,-1)">A második fagyasztó</text>
				<text x="15" y="60.99999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,121) scale(1,-1)">A középső hely 597×675×1455 mm-es készülékjelölttel szerepel. Pontos típus, szellőzés és ajtónyitás még nincs lezárva. A 600</text>
