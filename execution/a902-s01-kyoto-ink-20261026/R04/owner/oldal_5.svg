				<text x="15" y="125" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,250) scale(1,-1)">A bicikli helyét is megrajzoltuk</text>
				<text x="15" y="118" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,236) scale(1,-1)">A déli fal jobb sarkán 1 függőlegesen tárolt bicikli helye látható. Elfordítottuk a próbát, így mindkét BROR megmarad; a jobb polc</text>
				<text x="15" y="113.6" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,227) scale(1,-1)">50 mm-rel balra kerül. A bicikli és a polc között nincs tartalékhézag: az ajtóval, falrögzítéssel és kiemeléssel együtt még ellenőrizni</text>
				<text x="15" y="109.19999999999999" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,218) scale(1,-1)">kell.</text>
				<text x="15" y="97.79999999999998" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,195) scale(1,-1)">Bőröndök és dobozok</text>
				<text x="15" y="90.79999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,181) scale(1,-1)">A két alsó magas rekeszben összesen 4 darab 350×500×700 mm-es próbabőrönd férőhelye van; 25% tartalékkal 3-mal</text>
				<text x="15" y="86.39999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,172) scale(1,-1)">számoljunk. A felső 6 polcon 12 darab 350×500 mm-es dobozhelyből 9-et töltsünk meg. A bicikli miatt a külön padlón álló</text>
				<text x="15" y="81.99999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,163) scale(1,-1)">bőröndhely megszűnik.</text>
				<text x="15" y="70.59999999999997" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,141) scale(1,-1)">Miért tart hónapokig? Mi jöhet közbe?</text>
				<text x="15" y="63.599999999999966" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,127) scale(1,-1)">A felmérés, anyagminta, ajánlat, gyártás és beépítés egymásra épül. A korábbi terv 14–16 hetet irányzott elő a döntésektől; ez</text>
				<text x="15" y="59.19999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,118) scale(1,-1)">nem visszaigazolt határidő. A rossz méret, elhúzódó mintázás vagy későn kiválasztott vasalat újragyártást okozhat.</text>
				<text x="15" y="47.79999999999997" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,95) scale(1,-1)">Hogyan lehet gyorsítani?</text>
				<text x="15" y="40.79999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,81) scale(1,-1)">Egy közös felmérésen rögzítsük a lakást, két tárolót és kiállásokat. A médiafal mintája és a gardrób működési mintája</text>
				<text x="15" y="36.39999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,72) scale(1,-1)">párhuzamosan készüljön. Azonos rajzrevízióra kérjünk összehasonlítható ajánlatokat; rendelés csak a változat, ár és átfutás</text>
				<text x="15" y="31.99999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,63) scale(1,-1)">jóváhagyása után.</text>
