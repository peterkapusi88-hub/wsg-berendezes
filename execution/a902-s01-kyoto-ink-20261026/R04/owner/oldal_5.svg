				<text x="15" y="268" style="font-family: KIB; font-size: 6.2px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,536) scale(1,-1)">T-0-26: bicikli és szezonális holmik</text>
				<text x="15" y="258" style="font-family: KI; font-size: 3.2px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,516) scale(1,-1)">A garázsszinti tároló 4,00 m². A 2500×1600 mm keret és az ajtó a jelen tervben feltételes.</text>
