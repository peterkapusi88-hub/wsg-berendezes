			<g transform=" matrix(2.834646,0,0,2.834646,0,0)">
				<rect x="0" y="0" width="210" height="297" style="stroke: none; stroke-linecap: butt; stroke-width: 0.18; fill: rgb(98%,97%,95%); fill-rule: evenodd;"/>
				<text x="15" y="280" style="font-family: KIB; font-size: 3.2px;fill: rgb(46%,46%,44%); stroke:none;" transform="translate(0,560) scale(1,-1)">KYOTO INK / A-902</text>
				<text x="15" y="268" style="font-family: KIB; font-size: 6.2px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,536) scale(1,-1)">A hétköznapi dolgok helye</text>
				<text x="15" y="258" style="font-family: KI; font-size: 3.2px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,516) scale(1,-1)">A tárgyakat használat szerint csoportosítjuk; a látható polc nem jelent automatikusan szabad tárolóhelyet.</text>
				<path d="M 15,20 L 195,20 Z" style="stroke: rgb(46%,46%,44%); stroke-linecap: butt; stroke-width: 0.13;"/>
				<text x="15" y="13" style="font-family: KI; font-size: 2.6px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,26) scale(1,-1)">R04 / 2026-10-27 - tervezési útmutató, nem rendelési lista</text>
				<text x="189.5517578125" y="13" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,26) scale(1,-1)">3 / 5</text>
				<text x="15" y="239" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,478) scale(1,-1)">Porszívó + vasalódeszka</text>
				<text x="15" y="232" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,464) scale(1,-1)">WS-01/B04, 559×423 mm alapterület, kb. 1780 mm magas szabad hely. Próbatárgyak: állóporszívó 250×250×1250; összecsukott</text>
				<text x="15" y="227.6" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,455) scale(1,-1)">deszka 350×100×1500 mm. A konkrét géppel ellenőrizendő.</text>
				<text x="15" y="216.2" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,432) scale(1,-1)">Takarítószerek</text>
				<text x="15" y="209.2" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,418) scale(1,-1)">WS-01/B04 felső, zárható rekeszében, kivehető cseppfogó tálcán. Élelmiszertől és textiltől elkülönítve. Nedves felmosó előbb</text>
				<text x="15" y="204.79999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,409) scale(1,-1)">száradjon ki; nem zárt ruhásszekrényben szárítjuk.</text>
				<text x="15" y="193.39999999999998" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,386) scale(1,-1)">Napi kávé, pirító, vízforraló</text>
				<text x="15" y="186.39999999999998" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,372) scale(1,-1)">A konyhában kijelölt kb. 600 mm pultsávon. Nem biztos, hogy mindhárom egyszerre elfér: 3×200 mm gépszélesség már kitölti a</text>
				<text x="15" y="181.99999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,363) scale(1,-1)">sávot, szellőzés nélkül. Gépméret és fedélnyitás alapján választandó kiosztás.</text>
				<text x="15" y="170.59999999999997" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,341) scale(1,-1)">Edények, evőeszköz, ritka gépek</text>
				<text x="15" y="163.59999999999997" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,327) scale(1,-1)">K-05/K-06 fiókjaiban főzéshez és előkészítéshez közel. Nehéz dagasztó a lakásban alsó tárolóban, a ritka tartalékgép AT8-01 alsó</text>
				<text x="15" y="159.19999999999996" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,318) scale(1,-1)">polcán. A kért nagy kamraszekrény még pultveszteséggel járna.</text>
				<text x="15" y="147.79999999999995" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,295) scale(1,-1)">Hajszárító, kefék, kozmetikum</text>
				<text x="15" y="140.79999999999995" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,281) scale(1,-1)">B62-01: a szifon terét levonva kell a fiókot osztani. A képhez igazított R04A két egymás melletti fiókot mutat. A régi két egymás</text>
				<text x="15" y="136.39999999999995" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,272) scale(1,-1)">fölötti fiók összehasonlításként maradt meg. A fiókdugalj gyártói/villamos egyeztetést igényel.</text>
				<text x="15" y="124.99999999999994" style="font-family: KIB; font-size: 3.7px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,249) scale(1,-1)">Cipő, kutyás felszerelés, játék</text>
				<text x="15" y="117.99999999999994" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,235) scale(1,-1)">Előtér: napi kabát, cipő, póráz és tiszta törlő. WS-01 cipős polcán 559 mm szélességre két 250 mm-es párhely tervezhető;</text>
				<text x="15" y="113.59999999999994" style="font-family: KI; font-size: 3.1px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,227) scale(1,-1)">csizmához külön magas rekesz. Játék: W52-B04 és a médiafal alsó tárolója, kivehető könnyű dobozokban.</text>
			</g>
