<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190.5511811023623 841.8897637795277"><rect x="0" y="0.0" width="1190.5511811023623" height="841.8897637795277" fill="#333333" stroke="none"/><text x="35" y="35.0" font-family="Arial" font-size="12" fill="#30332f">KYOTO INK / A–902</text><text x="35" y="66.0" font-family="Arial" font-size="22" fill="#30332f">Konyha / egységes kődekor és valós használati hely</text><text x="35" y="88.0" font-family="Arial" font-size="9" fill="#30332f">R06 · 2026-10-27 · milliméter · ajánlatkérési / felmérési terv, nem gyártási kiadás</text><text x="1060.5511811023623" y="818.8897637795277" font-family="Arial" font-size="9" fill="#30332f">05 / KI-R06</text><rect x="90" y="457.8897637795277" width="292" height="124" fill="#beb4a1" stroke="#333333"/><rect x="90" y="165.8897637795277" width="320" height="124" fill="#beb4a1" stroke="#333333"/><line x1="430" y1="457.8897637795277" x2="430" y2="289.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="427" y1="460.8897637795277" x2="433" y2="454.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="427" y1="292.8897637795277" x2="433" y2="286.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="434.0" y="368.8897637795277" font-family="Arial" font-size="9" fill="#30332f">840 szabad munkasáv</text><rect x="220" y="337.8897637795277" width="120" height="120" fill="#d2ab82" stroke="#333333"/><line x1="450" y1="337.8897637795277" x2="450" y2="289.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="447" y1="340.8897637795277" x2="453" y2="334.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="447" y1="292.8897637795277" x2="453" y2="286.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="454.0" y="308.8897637795277" font-family="Arial" font-size="9" fill="#30332f">240 nyitott gép mellett</text><rect x="90" y="614.8897637795277" width="820" height="92" fill="#c7bfae" stroke="#333333"/><line x1="382" y1="706.8897637795277" x2="382" y2="614.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="702" y1="706.8897637795277" x2="702" y2="614.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="882" y1="706.8897637795277" x2="882" y2="614.8897637795277" stroke="#333333" stroke-width="0.65"/><text x="90" y="729.8897637795277" font-family="Arial" font-size="10" fill="#30332f">4100×920×38 nyerslap:1460+1600+900+vágási ráhagyások; a darabok620 mm mélyek</text><text x="620" y="172.8897637795277" font-family="Arial" font-size="11" fill="#30332f">K-08/K-09 · EGGER F243 ST76 Candela márványhatású laminátum</text><text x="620" y="198.28976377952768" font-family="Arial" font-size="11" fill="#30332f">A széles920 mm lapot kell árazni. A kedvezőbb600 mm lap nem éri el a 620 mm tervezett</text><text x="620" y="213.68976377952765" font-family="Arial" font-size="11" fill="#30332f">pultmélységet.</text><text x="620" y="239.08976377952763" font-family="Arial" font-size="11" fill="#30332f">1460×620 és1600×620 pult,900×620 oldalzárás. A 38 mm él a renderben vékonyabbnak tűnhet:</text><text x="620" y="254.4897637795276" font-family="Arial" font-size="11" fill="#30332f">ez dokumentált eltérés.</text><text x="620" y="279.8897637795276" font-family="Arial" font-size="11" fill="#30332f">Tervi szabásból három hossz3960 mm; 4100 mm táblán140 mm marad a szélezésre és</text><text x="620" y="295.28976377952756" font-family="Arial" font-size="11" fill="#30332f">fűrészrésre. Erezetfordulás a vízesés-élnél nem automatikusan folytonos.</text><text x="620" y="320.68976377952754" font-family="Arial" font-size="11" fill="#30332f">A mosogatógép teljesen nyitva nem hagy átjárót. Oldalról történő rakodás javasolt, nem egyidejű</text><text x="620" y="336.0897637795275" font-family="Arial" font-size="11" fill="#30332f">áthaladás. Megmarad a teljes pultmélység és a főzőlap helye.</text><text x="620" y="361.48976377952755" font-family="Arial" font-size="11" fill="#30332f">A lap150000 Ft csomagkeret:96750lap+53250szabás/kivágás/él előirányzat. Hátfal100000 Ft.</text><text x="620" y="376.8897637795275" font-family="Arial" font-size="11" fill="#30332f">Kötések, főzőlap hővédelme, vízzárás gyártói ellenőrzésre vár.</text></svg>