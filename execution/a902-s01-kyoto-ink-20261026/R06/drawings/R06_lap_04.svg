<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190.5511811023623 841.8897637795277"><rect x="0" y="0.0" width="1190.5511811023623" height="841.8897637795277" fill="#333333" stroke="none"/><text x="35" y="35.0" font-family="Arial" font-size="12" fill="#30332f">KYOTO INK / A–902</text><text x="35" y="66.0" font-family="Arial" font-size="22" fill="#30332f">BED-01 / felnyíló tárolóágy – ütközést kiváltó terv</text><text x="35" y="88.0" font-family="Arial" font-size="9" fill="#30332f">R06 · 2026-10-27 · milliméter · ajánlatkérési / felmérési terv, nem gyártási kiadás</text><text x="1060.5511811023623" y="818.8897637795277" font-family="Arial" font-size="9" fill="#30332f">04 / KI-R06</text><rect x="80" y="141.8897637795277" width="505" height="450" fill="#e1d9c8" stroke="#333333"/><line x1="80" y1="366.8897637795277" x2="585" y2="366.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="80" y1="616.8897637795277" x2="585" y2="616.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="77" y1="619.8897637795277" x2="83" y2="613.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="582" y1="619.8897637795277" x2="588" y2="613.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="336.5" y="611.8897637795277" font-family="Arial" font-size="9" fill="#30332f">2020 külső hossz</text><line x1="60" y1="591.8897637795277" x2="60" y2="141.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="57" y1="594.8897637795277" x2="63" y2="588.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="57" y1="144.8897637795277" x2="63" y2="138.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="64.0" y="361.8897637795277" font-family="Arial" font-size="9" fill="#30332f">1800 külső szélesség</text><rect x="100" y="381.8897637795277" width="465" height="180" fill="#c8bea7" stroke="#333333"/><text x="115" y="476.8897637795277" font-family="Arial" font-size="12" fill="#30332f">Tárolórekesz / közös fedél alatt</text><rect x="100" y="156.8897637795277" width="465" height="180" fill="#c8bea7" stroke="#333333"/><text x="115" y="251.8897637795277" font-family="Arial" font-size="12" fill="#30332f">Tárolórekesz / közös fedél alatt</text><rect x="670" y="521.8897637795277" width="404" height="60" fill="#ded4bf" stroke="#333333"/><rect x="672" y="465.8897637795277" width="400" height="56" fill="#eee7d7" stroke="#333333"/><line x1="650" y1="581.8897637795277" x2="650" y2="465.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="647" y1="584.8897637795277" x2="653" y2="578.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="647" y1="468.8897637795277" x2="653" y2="462.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="654.0" y="518.8897637795277" font-family="Arial" font-size="9" fill="#30332f">300váz+280matrac</text><text x="670" y="192.8897637795277" font-family="Arial" font-size="11" fill="#30332f">KI-043 · előirányzat250000 Ft + KI-044 matrac229900 Ft</text><text x="670" y="218.28976377952768" font-family="Arial" font-size="11" fill="#30332f">A célkép alacsony, világos kárpitozott teste megmarad. Az oldalfiókok helyett felfelé</text><text x="670" y="233.68976377952765" font-family="Arial" font-size="11" fill="#30332f">nyíló tároló teszi lehetővé a két éjjeli megtartását.</text><text x="670" y="259.08976377952763" font-family="Arial" font-size="11" fill="#30332f">Javasolt szerkezet:18 mm rétegelt lemez váz, középső hosszgerenda, egyetlen,</text><text x="670" y="274.4897637795276" font-family="Arial" font-size="11" fill="#30332f">kétoldalt vezetett közös emelőkeret, az180 cm-es egybefüggő matrac alatt. Látható</text><text x="670" y="289.8897637795276" font-family="Arial" font-size="11" fill="#30332f">kárpit huzatmintából; szellőzőfenék.</text><text x="670" y="315.2897637795277" font-family="Arial" font-size="11" fill="#30332f">Két tervezett840×1900×220 mm tárolóüreg: összesen702 liter geometriai tér, a vasalat</text><text x="670" y="330.68976377952765" font-family="Arial" font-size="11" fill="#30332f">levonása előtt. Tényleges kapacitás a választott mechanikával kisebb.</text><text x="670" y="356.0897637795277" font-family="Arial" font-size="11" fill="#30332f">Emelővasalat SKU, gázteleszkóp erő, terhelés, becsípődésvédelem és nyitási görbe</text><text x="670" y="371.48976377952766" font-family="Arial" font-size="11" fill="#30332f">még nyitott. A fejvégnél szükséges előreemelő mozgást a gyártónak igazolnia kell. Ezek</text><text x="670" y="386.88976377952764" font-family="Arial" font-size="11" fill="#30332f">nélkül nem gyártható.</text><text x="670" y="412.2897637795277" font-family="Arial" font-size="11" fill="#30332f">A 580 mm teljes alvómagasságot a tulajdonossal próbán ellenőrizni kell; fejvég és</text><text x="670" y="427.68976377952765" font-family="Arial" font-size="11" fill="#30332f">lámpahely ehhez igazodik.</text></svg>