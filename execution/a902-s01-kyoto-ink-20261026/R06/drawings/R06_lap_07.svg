<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190.5511811023623 841.8897637795277"><rect x="0" y="0.0" width="1190.5511811023623" height="841.8897637795277" fill="#333333" stroke="none"/><text x="35" y="35.0" font-family="Arial" font-size="12" fill="#30332f">KYOTO INK / A–902</text><text x="35" y="66.0" font-family="Arial" font-size="22" fill="#30332f">05.3 dolgozó / 180 cm vendégágy megtartva</text><text x="35" y="88.0" font-family="Arial" font-size="9" fill="#30332f">R06 · 2026-10-27 · milliméter · ajánlatkérési / felmérési terv, nem gyártási kiadás</text><text x="1060.5511811023623" y="818.8897637795277" font-family="Arial" font-size="9" fill="#30332f">07 / KI-R06</text><rect x="86.5" y="289.13976377952775" width="387.75000000000006" height="321.75000000000006" fill="#f7f4ec" stroke="#333333"/><rect x="114.0" y="176.38976377952764" width="360.25000000000006" height="112.75000000000004" fill="#f7f4ec" stroke="#333333"/><rect x="474.25" y="500.8897637795278" width="68.75" height="110.0" fill="#f7f4ec" stroke="#333333"/><rect x="92.0" y="407.3897637795276" width="49.5" height="198.0" fill="#b0a58c" stroke="#333333"/><text x="94.0" y="601.3897637795276" font-family="Arial" font-size="6" fill="#30332f">W53-01</text><rect x="435.75" y="372.18976377952765" width="38.5" height="38.5" fill="#b0a58c" stroke="#333333"/><text x="437.75" y="406.68976377952765" font-family="Arial" font-size="6" fill="#30332f">NT-76</text><rect x="247.10000000000014" y="407.3897637795276" width="222.2" height="198.0" fill="#d9d2c5" stroke="#333333"/><rect x="317.5" y="181.8897637795277" width="132.0" height="77.0" fill="#d9d2c5" stroke="#333333"/><rect x="309.8000000000002" y="246.7897637795277" width="78.1" height="78.1" fill="#d9d2c5" stroke="#333333"/><line x1="247.10000000000014" y1="407.3897637795277" x2="247.10000000000014" y2="390.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="244.10000000000014" y1="410.3897637795277" x2="250.10000000000014" y2="404.3897637795277" stroke="#333333" stroke-width="0.5"/><line x1="244.10000000000014" y1="393.8897637795277" x2="250.10000000000014" y2="387.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="251.10000000000014" y="394.1397637795277" font-family="Arial" font-size="9" fill="#30332f">150</text><text x="640" y="193.8897637795277" font-family="Arial" font-size="12" fill="#30332f">Változás: ágyY4250→4150 mm; székY6550→6700 mm. ÉjjeliX14025,Y5920 mm.</text><text x="640" y="220.68976377952765" font-family="Arial" font-size="12" fill="#30332f">A 1800 mm fekvőszélesség és a 1800 mm gardrób nem csökken.600 mm</text><text x="640" y="237.4897637795276" font-family="Arial" font-size="12" fill="#30332f">székkihúzás után150 mm marad az ágyig; ez nem átjáró.</text><text x="640" y="264.2897637795277" font-family="Arial" font-size="12" fill="#30332f">Az ágy, íróasztal és gardrób mérete megmarad; az éjjeli kikerül a szék hátrahúzási</text><text x="640" y="281.08976377952763" font-family="Arial" font-size="12" fill="#30332f">sávjából.</text><text x="640" y="307.8897637795277" font-family="Arial" font-size="12" fill="#30332f">A futtatott Blender-vizsgálat eredménye külön naplóban. Az ajtókat mintavételezett</text><text x="640" y="324.68976377952765" font-family="Arial" font-size="12" fill="#30332f">mozgással vizsgáljuk; fogantyúk és tényleges tokméret felmérésre várnak.</text><text x="640" y="351.4897637795277" font-family="Arial" font-size="12" fill="#30332f">A tervezési befoglaló és a gyártói névleges méret nem helyszíni felmérés. A rajz és</text><text x="640" y="368.28976377952773" font-family="Arial" font-size="12" fill="#30332f">az R06modell azonos koordinátákat használ.</text></svg>