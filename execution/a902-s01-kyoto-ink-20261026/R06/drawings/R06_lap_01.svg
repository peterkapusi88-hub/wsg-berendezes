"Arial" font-size="11" fill="#30332f">A sötét torony színét külön mintán kell beállítani; a grafika itt újrarajzolt</text><text x="800" y="366.0897637795275" font-family="Arial" font-size="11" fill="#30332f">próbaváltozat, nem eredeti nyomdai master.</text><text x="800" y="391.48976377952755" font-family="Arial" font-size="11" fill="#30332f">Felső/toronyoldali/alsó LED: külön alu profil, diffúzor és hozzáférhető</text><text x="800" y="406.8897637795275" font-family="Arial" font-size="11" fill="#30332f">tápegység. A korábbi világítási költségsorokban szerepel; nincs</text><text x="800" y="422.2897637795275" font-family="Arial" font-size="11" fill="#30332f">újraszámítva.</text><text x="800" y="447.68976377952754" font-family="Arial" font-size="11" fill="#30332f">R05 belső kiosztás és szerelési lapok érvényben. Nyomtatás előtt 1:1</text><text x="800" y="463.0897637795275" font-family="Arial" font-size="11" fill="#30332f">keresztillesztési próba a torony és a falsík között.</text></svg>