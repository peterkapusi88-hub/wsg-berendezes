<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1190.5511811023623 841.8897637795277"><rect x="0" y="0.0" width="1190.5511811023623" height="841.8897637795277" fill="#333333" stroke="none"/><text x="35" y="35.0" font-family="Arial" font-size="12" fill="#30332f">KYOTO INK / A–902</text><text x="35" y="66.0" font-family="Arial" font-size="22" fill="#30332f">06.2 fürdő / T07 részletek és geometriai határ</text><text x="35" y="88.0" font-family="Arial" font-size="9" fill="#30332f">R06 · 2026-10-27 · milliméter · ajánlatkérési / felmérési terv, nem gyártási kiadás</text><text x="1060.5511811023623" y="818.8897637795277" font-family="Arial" font-size="9" fill="#30332f">06 / KI-R06</text><rect x="80" y="171.8897637795277" width="270" height="420" fill="#bc9e73" stroke="#333333"/><rect x="80" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="86" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="92" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="98" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="104" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="110" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="116" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="122" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="128" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="134" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="140" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="146" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="152" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="158" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="164" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="170" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="176" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="182" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="188" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="194" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="200" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="206" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="212" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="218" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="224" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="230" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="236" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="242" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="248" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><rect x="254" y="171.8897637795277" width="3" height="420" fill="#927247" stroke="#333333"/><line x1="260" y1="591.8897637795277" x2="260" y2="171.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="260" y1="461.8897637795277" x2="350" y2="461.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="260" y1="341.8897637795277" x2="350" y2="341.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="260" y1="221.8897637795277" x2="350" y2="221.8897637795277" stroke="#333333" stroke-width="0.65"/><line x1="80" y1="616.8897637795277" x2="350" y2="616.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="77" y1="619.8897637795277" x2="83" y2="613.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="347" y1="619.8897637795277" x2="353" y2="613.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="219.0" y="611.8897637795277" font-family="Arial" font-size="9" fill="#30332f">900 =600front+300fülke</text><line x1="60" y1="591.8897637795277" x2="60" y2="171.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="57" y1="594.8897637795277" x2="63" y2="588.8897637795277" stroke="#333333" stroke-width="0.5"/><line x1="57" y1="174.8897637795277" x2="63" y2="168.8897637795277" stroke="#333333" stroke-width="0.5"/><text x="64.0" y="376.8897637795277" font-family="Arial" font-size="9" fill="#30332f">1400; alsó él1300</text><text x="520" y="172.8897637795277" font-family="Arial" font-size="11" fill="#30332f">B62-WC / KI-R06-01 · 220000 Ft beépített előirányzat</text><text x="520" y="198.28976377952768" font-family="Arial" font-size="11" fill="#30332f">900×200×1400 mm;18 mm nedvességálló korpusz,19 mm front,10 mm lamella,8 mm hát. Zárt600 mm rekesz3állítható</text><text x="520" y="213.68976377952765" font-family="Arial" font-size="11" fill="#30332f">polccal;300 mm nyitott fülke.</text><text x="520" y="239.08976377952763" font-family="Arial" font-size="11" fill="#30332f">Belső polc564×173 mm,3db:0.293 m². Fülke282×173 mm,3szint:0.146 m². Papír, tartalék kozmetikum,</text><text x="520" y="254.4897637795276" font-family="Arial" font-size="11" fill="#30332f">vendégtörölköző; nem nagy gép tárolására.</text><text x="520" y="279.8897637795276" font-family="Arial" font-size="11" fill="#30332f">Táp száraz, levehető szervizhelyen. Fülkefény alu profilban, diffúzorral. A WC öblítőtartály szervizét sem ajtó, sem</text><text x="520" y="295.28976377952756" font-family="Arial" font-size="11" fill="#30332f">ragasztott burkolat nem zárhatja el.</text><text x="520" y="320.68976377952754" font-family="Arial" font-size="11" fill="#30332f">Tálca a hiteles modellben északi1780×850 mm. A javított1000 mm üveg a déli él keleti részén,780 mm névleges</text><text x="520" y="336.0897637795275" font-family="Arial" font-size="11" fill="#30332f">belépővel. Üveges felmérés szükséges.</text><text x="520" y="361.48976377952755" font-family="Arial" font-size="11" fill="#30332f">A T07 ág mintás falának és akasztóinak pontos képi helye nem fér össze bizonyítottan a zuhanyzónával. Vízálló</text><text x="520" y="376.8897637795275" font-family="Arial" font-size="11" fill="#30332f">grafikai változat készülhet; padot és ruhát oda nem helyezünk el jóváhagyás nélkül.</text><text x="520" y="402.28976377952756" font-family="Arial" font-size="11" fill="#30332f">ART-B62:110000 Ft; RAD-B62:120000 Ft előirányzat. Pontos radiátormodell és nyomtatott üvegrendszer még nem</text><text x="520" y="417.68976377952754" font-family="Arial" font-size="11" fill="#30332f">kiválasztott.</text></svg>