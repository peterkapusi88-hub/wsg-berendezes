6" fill="none"/><text x="60" y="760.55" font-family="Arial" font-size="12" fill="#252727">Kiválasztott tetőelv:382mm magas oldalak +18mm közös tető =400mm teljes bútor. Fenéklap18mm; tiszta magasság346mm. Nincs külön modultető. A3600mm fedő illesztését és szállíthatóságát gyártó ellenőrizze; a névleges méretek felmérésig nem gyártási adatok.</text><text x="60" y="850.55" font-family="Arial" font-size="12" fill="#252727">Vasalat:40db toronypolctartó +16db alsó polctartó, teherbírási jóváhagyással; rögzített tető/fenék kötése gyártói rendszer.</text><text x="60" y="880.55" font-family="Arial" font-size="12" fill="#252727">Frontok:2 magas +5 alsó ajtó; pánt/csillapító darabszám gyártói tömeg- és magasságtáblázatból, nem becsült csavarlista.</text><text x="60" y="910.55" font-family="Arial" font-size="12" fill="#252727">M01: grafit lap, EGGER U961 ST7 jelölt; M02: nyomathordozó a18mm lapon; M03: világos egyszínű belső laminált lap.</text><text x="60" y="940.55" font-family="Arial" font-size="12" fill="#252727">Polcfelület: torony1,059m²; alsó (682+3×652)×320=0,844m². Fenéklap, AV és köztes sáv nélkül.</text><text x="60" y="970.55" font-family="Arial" font-size="12" fill="#252727">A becsült1250500Ft asztalos keret új ajánlattal igazolandó. Nem bizonyított, hogy minden új belső részlet ezen belül elkészül.</text></svg>