				<text x="230" y="168" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,336) scale(1,-1)">Sarkon nincs vastag képkeret. Élvédelem és visszafordulás próbadarabbal. Dugalj, kapcsoló és felső dobozolás helyét</text>
