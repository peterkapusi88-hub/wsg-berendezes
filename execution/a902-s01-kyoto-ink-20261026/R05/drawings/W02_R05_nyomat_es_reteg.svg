				<text x="230" y="126" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,252) scale(1,-1)">KI-131: 60000 grafika. KI-132: 224000 nyomat. KI-133: 177000 hordozó/él/rögzítés/szerelés. Összes 461000 Ft becslés;</text>
				<text x="230" y="121.5" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,243) scale(1,-1)">logisztika KI-151 közös keretben.</text>
				<text x="25" y="44" style="font-family: KI; font-size: 2.8px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,88) scale(1,-1)">Nem alkalmazunk kitalált nyomdai profilt.1: 1 fekete/greige/szövés próba; nappali és 2700 K esti jóváhagyás. A célkép felső lépcsőzése és falreturnje felmérésre vár: ez a lap csak a 2100×2880 tervi mezőt számszerűsíti.</text>
