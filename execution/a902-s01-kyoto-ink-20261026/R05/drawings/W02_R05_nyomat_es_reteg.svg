				<text x="25" y="246" style="font-family: KIB; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,492) scale(1,-1)">NETTÓ MEZŐ / A NYOMAT NINCS MÉG RÁHELYEZVE</text>
				<text x="155" y="245" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,490) scale(1,-1)">Nettó: 2,10×2,88=6,048 m². Nyomdai előirányzat: két 1340 mm széles, 2980 mm hosszú sáv. Teljes 7,9864 m², árazva 8,0 m². Ebből a túlnyúlás/szélvágás 1,9384 m²; ez nem rejtett</text>
				<text x="155" y="240.5" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,481) scale(1,-1)">második fal.</text>
				<text x="155" y="214" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,428) scale(1,-1)">A két 1050 mm mező 100 mm összes oldalsó ráhagyással 1150 mm, belefér a 1330 mm nyomtatható szélességbe. A végleges varratot a motívum kevésbé hangsúlyos részére kell</text>
				<text x="155" y="209.5" style="font-family: KI; font-size: 3px;fill: rgb(14%,14%,13%); stroke:none;" transform="translate(0,419) scale(1,-1)">tenni. A PDF-ben szereplő 50 mm ráhagyás technológiai javaslat, a nyomda felülírhatja.</text>
