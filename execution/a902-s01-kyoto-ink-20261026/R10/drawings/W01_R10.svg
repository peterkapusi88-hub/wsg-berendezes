277" x2="160.2" y2="116.8897637795277" stroke="#333"/><line x1="45.0" y1="123.8897637795277" x2="45.0" y2="109.8897637795277" stroke="#333"/><line x1="160.2" y1="123.8897637795277" x2="160.2" y2="109.8897637795277" stroke="#333"/><text x="90.6" y="102.8897637795277" font-family="Arial" font-size="10">720</text><line x1="160.2" y1="116.8897637795277" x2="179.4" y2="116.8897637795277" stroke="#333"/><line x1="160.2" y1="123.8897637795277" x2="160.2" y2="109.8897637795277" stroke="#333"/><line x1="179.4" y1="123.8897637795277" x2="179.4" y2="109.8897637795277" stroke="#333"/><text x="157.8" y="102.8897637795277" font-family="Arial" font-size="10">120</text><line x1="179.4" y1="116.8897637795277" x2="621.0" y2="116.8897637795277" stroke="#333"/><line x1="179.4" y1="123.8897637795277" x2="179.4" y2="109.8897637795277" stroke="#333"/><line x1="621.0" y1="123.8897637795277" x2="621.0" y2="109.8897637795277" stroke="#333"/><text x="388.2" y="102.8897637795277" font-family="Arial" font-size="10">2760 = 4 × 690</text><text x="45" y="673.8897637795277" font-family="Arial" font-size="13">Felülnézet / mélységek</text><rect x="45" y="690.8897637795277" width="115.2" height="64.0" fill="0x4b4b49" stroke="#333"/><rect x="160.2" y="693.7697637795277" width="19.2" height="2.88" fill="0x292b2b" stroke="#333"/><rect x="179.4" y="690.8897637795277" width="441.6" height="5.76" fill="0xb5aea1" stroke="#333"/><text x="45" y="774.8897637795277" font-family="Arial" font-size="10">Torony:400 mély; panel:36; 120 széles visszahúzott sáv. A TV külön falikonzolon.</text><text x="680" y="101.8897637795277" font-family="Arial" font-size="11">TERVI ELHELYEZÉS</text><text x="680" y="121.8897637795277" font-family="Arial" font-size="11">W01: Y4050–8050 =4000mm.</text><text x="680" y="141.8897637795277" font-family="Arial" font-size="11">Bútor: Y4350–7950 =3600mm.</text><text x="680" y="161.8897637795277" font-family="Arial" font-size="11">Marad: délen300 / északon100mm.</text><text x="680" y="181.8897637795277" font-family="Arial" font-size="11">Nem helyszíni felmérésből származik.</text><text x="680" y="201.8897637795277" font-family="Arial" font-size="11"></text><text x="680" y="221.8897637795277" font-family="Arial" font-size="11">FŐ SZINTEK</text><text x="680" y="241.8897637795277" font-family="Arial" font-size="11">Alsó bútor: Z150–550.</text><text x="680" y="261.8897637795277" font-family="Arial" font-size="11">Felső mező: Z550–2880.</text><text x="680" y="281.8897637795277" font-family="Arial" font-size="11">Torony felső rész:2330 magas.</text><text x="680" y="301.8897637795277" font-family="Arial" font-size="11">Teljes látható torony:2730 magas.</text><text x="680" y="321.8897637795277" font-family="Arial" font-size="11">A korábbi szöveg2500mm-e helyett</text><text x="680" y="341.8897637795277" font-family="Arial" font-size="11">a kiválasztott célképre illesztett javaslat.</text><text x="680" y="361.8897637795277" font-family="Arial" font-size="11"></text><text x="680" y="381.8897637795277" font-family="Arial" font-size="11">OSZTÁS ÉS NYITÁS</text><text x="680" y="401.8897637795277" font-family="Arial" font-size="11">Torony:2×360 felső ajtó,3mm hézag.</text><text x="680" y="421.8897637795277" font-family="Arial" font-size="11">Alsó:720 +120 szervizbetét +4×690.</text><text x="680" y="441.8897637795277" font-family="Arial" font-size="11">Felső panel:4×690,3mm munkahézag.</text><text x="680" y="461.8897637795277" font-family="Arial" font-size="11">Az infill süllyesztett, levehető.</text><text x="680" y="481.8897637795277" font-family="Arial" font-size="11">Nyitott frontok végleges söprése külön</text><text x="680" y="501.8897637795277" font-family="Arial" font-size="11">gyártói ellenőrzést igényel.</text><text x="680" y="521.8897637795277" font-family="Arial" font-size="11"></text><text x="680" y="541.8897637795277" font-family="Arial" font-size="11">KÖLTSÉGSOROK</text><text x="680" y="561.8897637795277" font-family="Arial" font-size="11">KI-030 panel/torony765500Ft becslés.</text><text x="680" y="581.8897637795277" font-family="Arial" font-size="11">KI-031 alsó350000Ft becslés.</text><text x="680" y="601.8897637795277" font-family="Arial" font-size="11">KI-032 szerelés135000Ft becslés.</text><text x="680" y="621.8897637795277" font-family="Arial" font-size="11">KI-034 konzol és KI-114 fény külön.</text><text x="40" y="811.8897637795277" font-family="Arial" font-size="10">Nem gyártási kiadás. A sík grafika és a 120mm fényrés részlete külön mintázandó; nincs kőrelief.</text></svg>