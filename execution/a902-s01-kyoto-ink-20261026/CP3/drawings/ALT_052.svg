			<text x="640" y="351.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,702) scale(1,-1)">A gardrób rögzített külső mérete mellett 32 mm-es polcraszter, kivehető</text>
			<text x="640" y="337.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,674) scale(1,-1)">játékdobozok, cserélhető belső polcok. Gyerekbiztonság, kor, ablak- és</text>
