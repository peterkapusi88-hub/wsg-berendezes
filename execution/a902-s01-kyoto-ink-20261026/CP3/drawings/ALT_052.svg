			<text x="640" y="677.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1354) scale(1,-1)">gardróblift. Nem veszünk el szekrényt az ajtóütközés miatt.</text>
			<text x="640" y="646.0" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1292) scale(1,-1)">A: meglévő ágy + kompakt asztal</text>
			<text x="640" y="627.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1254) scale(1,-1)">A fő ágy helyén marad. ALT052_B: 750×350 mm lehajtható lap és 450×450 mm</text>
			<text x="640" y="613.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1226) scale(1,-1)">ülőke; az erkélyajtó mintavételezett nyitási próbája megfelelt. A lap</text>
			<text x="640" y="599.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1198) scale(1,-1)">magassága és a szék a gyerek korához igazítandó. Nem teljes felnőtt</text>
			<text x="640" y="585.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1170) scale(1,-1)">munkaállomás.</text>
			<text x="640" y="554.0" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1108) scale(1,-1)">B: nappali / alvó átalakítás</text>
			<text x="640" y="535.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1070) scale(1,-1)">FYRESDAL 204.243.62 fekete acél jelölt: 2070×880×940; nyitva 1630 mm</text>
			<text x="640" y="521.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1042) scale(1,-1)">széles, két 800×2000 matraccal. A rajzon nappali és éjszakai helyigény. A</text>
			<text x="640" y="507.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1014) scale(1,-1)">két állapot között 1,55 m² padló szabadul fel; ez nem új szobaterület.</text>
			<text x="640" y="476.0" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,952) scale(1,-1)">Ár és látvány</text>
			<text x="640" y="457.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,914) scale(1,-1)">Magyar ár/szállítás nincs igazolva; a finn oldalon kifutó jelölés.</text>
			<text x="640" y="443.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,886) scale(1,-1)">180–260 ezer Ft komplett helyettesítési előirányzat, nem bekerült</text>
			<text x="640" y="429.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,858) scale(1,-1)">projektköltség. Nettó csereár az aktuális ágy+matrac+szállítás kiváltása</text>
			<text x="640" y="415.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,830) scale(1,-1)">után számítható. A fekete fém sziluett eltér a kárpitozott Kyoto Ink</text>
			<text x="640" y="401.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,802) scale(1,-1)">ágytól.</text>
