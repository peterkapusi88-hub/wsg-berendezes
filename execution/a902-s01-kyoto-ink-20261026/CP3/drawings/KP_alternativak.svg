			<text x="590" y="700" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1400) scale(1,-1)">KP-800 szerkezet</text>
			<text x="590" y="680" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1360) scale(1,-1)">18 mm korpusz, 19 mm matt front, 8 mm hát, 30 mm szerviz; 764 mm nettó belszélesség.</text>
			<text x="590" y="664.6" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1329) scale(1,-1)">5× 664×400×150 mm tervezett fiók: 199,2 l. 155° nulla-benyúlású pánt; 450 mm vezető.</text>
			<text x="590" y="649.2" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1298) scale(1,-1)">Belső fiókok és ajtók együtt próbálandók.</text>
			<text x="590" y="617.8000000000001" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1235) scale(1,-1)">Ajtóbelső tároló</text>
			<text x="590" y="597.8000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1195) scale(1,-1)">75 mm mély tea/fűszer kosarak csak a felső, fiókok fölötti ajtózónában: 1250–2000 mm.</text>
			<text x="590" y="582.4000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1164) scale(1,-1)">Nem a fiókok elé. A boros rész 330 mm mély, a palackhossz felmérendő. 6 palackos egy</text>
			<text x="590" y="567.0000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1134) scale(1,-1)">sor a rajzon; nem borhűtő.</text>
			<text x="590" y="535.6000000000001" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1071) scale(1,-1)">KP-300 szerkezet</text>
			<text x="590" y="515.6000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1031) scale(1,-1)">264 mm névleges belszélesség; kosár tényleges nettó mérete és a magas kihúzó</text>
			<text x="590" y="500.20000000000016" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1000) scale(1,-1)">terhelése konkrét vasalattól függ. 5 kosár 420 mm raszteren. Nem jelöltük 100%-ban</text>
			<text x="590" y="484.8000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,969) scale(1,-1)">kihasználható tömör térfogatként.</text>
			<text x="590" y="453.4000000000002" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,906) scale(1,-1)">Fény és szerviz</text>
			<text x="590" y="433.4000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,866) scale(1,-1)">KP-800 felső és fiókos rész frontközeli 24 V fénye; ajtóérzékelő, felső hozzáférhető</text>
			<text x="590" y="418.0000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,836) scale(1,-1)">meghajtó. KP-300 oldalsó profil, mozgó kosárszerkezet útján kívül. Fénykészlet és</text>
			<text x="590" y="402.60000000000025" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,805) scale(1,-1)">bekötés a kamra árajánlatának része.</text>
			<text x="590" y="371.2000000000003" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,742) scale(1,-1)">Döntés</text>
			<text x="590" y="351.2000000000003" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,702) scale(1,-1)">A rajzok tényleges alternatíva-kialakítások. A 840 mm munkaköz és az elvesző pult</text>
			<text x="590" y="335.8000000000003" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,671) scale(1,-1)">miatt nem kerültek észrevétlenül a fő lakásmodellbe vagy a költségösszegbe.</text>
