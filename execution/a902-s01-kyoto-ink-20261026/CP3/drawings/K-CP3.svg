			<text x="570" y="710" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1420) scale(1,-1)">Használati sorrend</text>
			<text x="570" y="693" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1386) scale(1,-1)">Hűtő K-02 → mosogató melletti kis lerakó → K-03 mosogató → átfordulás K-06 nagy előkészítőhöz</text>
			<text x="570" y="679.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1358) scale(1,-1)">→ K-05 főzőlap → edénylerakó a szomszéd pulton → K-01 sütő/mikro. Többsoros konyha; nem</text>
			<text x="570" y="665.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1330) scale(1,-1)">egyetlen balról jobbra nézet.</text>
			<text x="570" y="639.0" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1278) scale(1,-1)">Napi gépek</text>
			<text x="570" y="622.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1244) scale(1,-1)">K-04 mosogatógép fölötti kb. 600 mm pult a kávé/pirító zónája. A felnyíló gépfedelek és felső</text>
			<text x="570" y="608.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1216) scale(1,-1)">szekrény közti távolság géptípus alapján ellenőrzendő. K-06 marad az előkészítésé.</text>
			<text x="570" y="582.0" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1164) scale(1,-1)">Lerakó feltétel</text>
			<text x="570" y="565.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1130) scale(1,-1)">A mosogató pontos mérete még hiányzik; a hűtő felőli kb. 300 mm lerakó csak kompakt medence</text>
			<text x="570" y="551.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1102) scale(1,-1)">és gyártói kivágás mellett alakítható ki. Nem igazolt, kész munkapultként nem számított.</text>
			<text x="570" y="525.0" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1050) scale(1,-1)">Kamra A - 800 mm</text>
			<text x="570" y="508.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1016) scale(1,-1)">800×600×2400, két 400 mm ajtó; öt belső fiók; felső bortartó és polcok. 420 000 Ft becsült</text>
			<text x="570" y="494.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,988) scale(1,-1)">teljes új elem, kiváltott K-06-rész után nettó felár ajánlattal. A 1000 mm előkészítő 200 mm-</text>
			<text x="570" y="480.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,960) scale(1,-1)">re fogy: nem javasolt főváltozat.</text>
			<text x="570" y="454.0" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,908) scale(1,-1)">Kamra B - 300 mm</text>
			<text x="570" y="437.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,874) scale(1,-1)">300×600×2400 keskeny kihúzható; 5 kosár. 160 000 Ft becsült új elem, kiváltott korpusz</text>
			<text x="570" y="423.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,846) scale(1,-1)">levonandó. 700 mm előkészítő marad: érdemi kompromisszum, nem automatikusan elfogadott.</text>
			<text x="570" y="397.0" style="font-family: ArialB; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,794) scale(1,-1)">Fő javaslat</text>
			<text x="570" y="380.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,760) scale(1,-1)">K-01 felső szárazélelmiszer, K-07 napi készlet, K-06 alsó fiókok; ritka nehéz gép alul.</text>
			<text x="570" y="366.0" style="font-family: Arial; font-size: 10px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,732) scale(1,-1)">AT8-01 csak tartalékkészlet. A kért teljes kamra még nem fér be tartalomveszteség nélkül.</text>
