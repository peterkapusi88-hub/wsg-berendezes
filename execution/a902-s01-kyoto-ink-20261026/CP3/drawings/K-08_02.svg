			<text x="55" y="91" style="font-family: Arial; font-size: 9px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,182) scale(1,-1)">A nettó értékekből további 25% szabad tartalék javasolt. Terhelés, nyitási ütközés, fali rögzítés és kész belméret jóváhagyása még szükséges. A részletes alkatrész- és</text>
