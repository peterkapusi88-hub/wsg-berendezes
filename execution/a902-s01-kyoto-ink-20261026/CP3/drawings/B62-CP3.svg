			<text x="45" y="759" style="font-family: Arial; font-size: 11px;fill: rgb(65%,30%,21%); stroke:none;" transform="translate(0,1518) scale(1,-1)">900×500×350 mm célbefoglaló · mm · 1:5 részlet · Vizes zóna és gyártói jóváhagyás szükséges</text>
