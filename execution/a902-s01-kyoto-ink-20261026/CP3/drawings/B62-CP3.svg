			<text x="590" y="710" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1420) scale(1,-1)">Fiókkialakítás</text>
			<text x="590" y="691" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1382) scale(1,-1)">Felső fiók U alakú szifonkikerüléssel; alsó fiókban elkülönített hajszárító és</text>
			<text x="590" y="675.6" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1351) scale(1,-1)">tartozék. 450 mm névleges vezető tervezett. A 30 mm hátsó szervizsáv itt elmarad:</text>
			<text x="590" y="660.2" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1320) scale(1,-1)">kábel a felső / oldalsó hozzáférhető térben.</text>
			<text x="590" y="630.8000000000001" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1261) scale(1,-1)">Jelölt rendszer</text>
			<text x="590" y="611.8000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1223) scale(1,-1)">Blum AMPEROS AC, EU 230 V, ESS.B01FA.2 jelölt aljzat. Nem amerikai 120 V termék.</text>
			<text x="590" y="596.4000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1192) scale(1,-1)">Pontos 450 mm vezetőhöz tartozó kábelvezetés, kompatibilis fiókrendszer és</text>
			<text x="590" y="581.0000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1162) scale(1,-1)">rendelési lista gyártói egyeztetésre vár.</text>
			<text x="590" y="551.6000000000001" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1103) scale(1,-1)">Bekötés</text>
			<text x="590" y="532.6000000000001" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1065) scale(1,-1)">Meglévő, bemért kör → villanyszerelő által ellenőrzött védelem → fix</text>
			<text x="590" y="517.2000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1034) scale(1,-1)">bútorcsatlakozás → gyári mozgó kábelvezető → fiókaljzat. Laza hosszabbító és éles</text>
			<text x="590" y="501.8000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,1003) scale(1,-1)">élen megtört kábel nincs a tervben.</text>
			<text x="590" y="472.4000000000002" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,944) scale(1,-1)">Használat</text>
			<text x="590" y="453.4000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,906) scale(1,-1)">Forró hajformázó nem zárható textilre. Használat nyitott fióknál, száraz kézzel;</text>
			<text x="590" y="438.0000000000002" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,876) scale(1,-1)">tárolás kihűlve, áramtalanítva. Kapcsolás / hővédelem és a készülék gyártói</text>
			<text x="590" y="422.60000000000025" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,845) scale(1,-1)">előírása a végleges szakági terv része.</text>
			<text x="590" y="393.2000000000003" style="font-family: ArialB; font-size: 12px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,786) scale(1,-1)">Kapu / alternatíva</text>
			<text x="590" y="374.2000000000003" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,748) scale(1,-1)">A fiókba integrált rendszer nem jóváhagyott. Ha nem fér el vagy a vizes zóna nem</text>
			<text x="590" y="358.8000000000003" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,717) scale(1,-1)">engedi: külön, hozzáférhető fix aljzat, ugyanazzal a tárolórekesszel. Fő</text>
			<text x="590" y="343.4000000000003" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,686) scale(1,-1)">előirányzat 145 000, gazdaságos fix megoldás 40 000 Ft; nem egyszerre összegezve.</text>
			<text x="65" y="290" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,580) scale(1,-1)">Metszeti elv: 19 mm front + 450 mm névleges vezető + 8 mm hát = 477 mm. A</text>
			<text x="65" y="274.6" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,549) scale(1,-1)">fennmaradó 23 mm nem automatikus szerelési megfelelés: a konkrét vasalat</text>
			<text x="65" y="259.20000000000005" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,518) scale(1,-1)">előírt korpuszmélysége és a vízcsatlakozás dönt. A rajz nem engedélyezi a</text>
			<text x="65" y="243.80000000000004" style="font-family: Arial; font-size: 11px;fill: rgb(16%,21%,20%); stroke:none;" transform="translate(0,487) scale(1,-1)">mosdókerámia vágását.</text>
